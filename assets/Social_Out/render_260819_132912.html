<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>

html,body{margin:0;padding:0}
.card{width:100vw;height:100vh;background:#1e1638;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:6%;}

.tagline{font-family:'Inter',sans-serif;font-weight:300;color:#f3cc13;font-size:4vh;margin:0 0 6vh 0;}
.logo{height:18vh;}
</style>
</head>
<body>
<div class="card">
  <div class="headline">Paul Duncan</div>
  <div class="quote">“The brushstroke is never a lie — it’s a truth in motion.”</div>
  <div class="tagline">Hyper-Realism</div>
  <img class="logo" src="file:///C:/Users/Bola/Documents/Shack_Project/assets/Shack_Logos/shack_trans.png">
